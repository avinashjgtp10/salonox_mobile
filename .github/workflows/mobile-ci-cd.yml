
---
name: Mobile CI/CD

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      build_profile:
        description: EAS build profile to run on demand
        required: true
        default: development
        type: choice
        options:
          - development
          - qa

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm run test:ci

      - name: Validate Expo config (development, qa, production)
        run: |
          for env in development qa production; do
            echo "--- APP_ENV=$env ---"
            APP_ENV="$env" npx expo config --type public > /dev/null
          done

  development-build:
    name: Development Build
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_profile == 'development'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-development
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (development profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile development --non-interactive

  qa-build:
    name: QA Build
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_profile == 'qa'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-qa
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (qa profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile qa --non-interactive

  production-build:
    name: Production Build
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (production profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile production --non-interactive

  production-update:
    name: Production Update
    needs: production-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-update-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS update (production channel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel production --environment production --message "Production OTA update"
