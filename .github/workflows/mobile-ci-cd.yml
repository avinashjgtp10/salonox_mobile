---
name: Mobile CI/CD

# Production releases live in their own workflows:
#   mobile-ota-release.yml   - every push to main ships an OTA (no store build)
#   mobile-store-release.yml - every Friday (or on demand) builds and submits AAB + IPA
on:
  push:
    branches: [dev, qa]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      build_profile:
        description: EAS build profile to run on demand
        required: true
        default: development
        type: choice
        options:
          - development
          - qa

permissions:
  contents: read

jobs:
  ci:
    name: CI
    concurrency:
      group: mobile-ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/mobile-ci.yml

  development-build:
    name: Development Build
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_profile == 'development'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-development
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (development profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile development --non-interactive

  qa-build:
    name: QA Build
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_profile == 'qa'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-qa
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (qa profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile qa --non-interactive
