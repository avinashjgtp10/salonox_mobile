
---
name: Mobile CI/CD

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      build_profile:
        description: EAS build profile to run on demand
        required: true
        default: development
        type: choice
        options:
          - development
          - qa
          - production

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm run test:ci

      - name: Release configuration tests
        run: node --test scripts/prepare-production-release.test.js

      - name: Validate Expo config (development, qa, production)
        run: |
          for env in development qa production; do
            echo "--- APP_ENV=$env ---"
            APP_ENV="$env" npx expo config --type public > /dev/null
          done

  development-build:
    name: Development Build
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_profile == 'development'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-development
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (development profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile development --non-interactive

  qa-build:
    name: QA Build
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_profile == 'qa'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-build-qa
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS build (qa profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile qa --non-interactive

  production-release:
    name: Build and submit Android and iOS
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_profile == 'production'))
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-production-release
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
      # Optional one-off version override; delete the variable after the release.
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      APP_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22: eas-cli's dependency @oclif/plugin-autocomplete now requires
      # node >=22, and the Setup EAS step installs it with yarn, which refuses
      # engine mismatches ("Setup EAS" failed on Node 20).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 20.5.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare app version and submission configuration
        run: node scripts/prepare-production-release.js

      - name: Validate production update environment
        run: eas env:exec production "node scripts/validate-production-update-env.js" --non-interactive

      - name: Build AAB and IPA and queue store submissions
        run: eas build --platform all --profile production --auto-submit --non-interactive --wait

      # No OTA here: the store build already contains this exact code. Publishing
      # it as an OTA too made every fresh store install show a pointless
      # "restart to update" popup right after updating from the store.
