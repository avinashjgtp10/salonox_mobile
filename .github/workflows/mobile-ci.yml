---
name: Mobile CI checks

# Shared checks, called by Mobile CI/CD, Mobile OTA Release and Mobile Store Release.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm run test:ci

      - name: Release pipeline tests
        run: node --test scripts/prepare-production-release.test.js scripts/release-pipeline.test.js

      - name: Validate Expo config (development, qa, production)
        run: |
          for env in development qa production; do
            echo "--- APP_ENV=$env ---"
            APP_ENV="$env" npx expo config --type public > /dev/null
          done
