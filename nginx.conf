server {
    listen 80;
    root /usr/share/nginx/html;
    server_name _;

    # Unknown URLs get the prerendered 404 page with a real 404 status
    # (previously they got the SPA shell with a 200, i.e. soft 404s).
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /404 { return 404; }

    # The homepage is prerendered to home.html. dist/index.html stays the
    # generic SPA shell used for the app routes below, so it must not be
    # overwritten and home.html must not become a second URL for the homepage.
    location = / { try_files /home.html /index.html; }
    location = /home { return 301 /; }
    location = /home.html { return 301 /; }

    # Routes owned by the React app: serve the SPA shell.
    # Keep this list identical to APP_ROUTE_PREFIXES in
    # src/marketing/seo.config.ts — scripts/prerender.mjs fails the build if
    # they differ.
    location ~ ^/(dashboard|super-admin|branch-owner|reports|login|register|forgot-password|oauth|oauth-success|accept-invite|join-business|business-name|business-location|venue-location|team-size|team-setup|service-type|recommendation-source|send-request|request-success|setup-complete|feedback|book|menu)(/|$) {
        try_files /index.html =404;
    }

    # Everything else: a real file (assets, robots.txt, sitemap.xml, images),
    # a prerendered marketing page (/terms -> terms.html), or a 404.
    location / {
        # /terms/ -> /terms (the homepage "/" is matched above, never here)
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html =404;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://salonox-backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy uploaded files (coupon PDFs, avatars, etc.) served by the backend's
    # own /uploads static mount. Without this, a request for e.g.
    # /uploads/designs/foo.pdf hits this nginx's own filesystem and finds no
    # such file (a 404 now; it used to fall through to the SPA shell).
    location /uploads/ {
        proxy_pass http://salonox-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
