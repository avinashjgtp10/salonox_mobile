server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_name _;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://salonox-backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy uploaded files (coupon PDFs, avatars, etc.) served by the backend's
    # own /uploads static mount. Without this, a request for e.g.
    # /uploads/designs/foo.pdf hits this nginx's own filesystem, finds no such
    # file, falls through to the SPA's `try_files ... /index.html`, and React
    # Router's wildcard route then redirects it to "/" — the marketing landing
    # page, in place of the file.
    location /uploads/ {
        proxy_pass http://salonox-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}